# Jeanclode - Docker Compose
#
# Profiles:
#   all:  Full stack - postgres, redis, migrate, backend
#   app:  App only - migrate, backend (bring your own postgres/redis)
#   test: Database only - postgres, migrate (for local development/tests)
#
# Usage:
#   1. cp .env.example .env
#   2. Edit .env with your credentials
#   3. docker compose --profile all up -d

name: jeanclode

services:
  # ==================== Database ====================
  postgres:
    profiles: ["test", "all"]
    image: postgres:16-alpine
    container_name: jeanclode-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jeanclode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Docker Socket Proxy ====================
  docker-proxy:
    profiles: ["test", "app", "all"]
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: jeanclode-docker-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      # Per-execution volumes for the sandboxed agent pair (/tmp scratch +
      # the CA/config sandbox volume).
      VOLUMES: 1
      POST: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jeanclode-network

  # ==================== Queue ====================
  redis:
    profiles: ["test", "all"]
    image: redis:7-alpine
    container_name: jeanclode-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - jeanclode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Database UI (dev only) ====================
  pgweb:
    profiles: ["test"]
    image: sosedoff/pgweb
    container_name: jeanclode-pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: ${DATABASE_URL}?sslmode=disable
    networks:
      - jeanclode-network
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== Database Migrations ====================
  migrate:
    profiles: ["test", "app", "all"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeanclode-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JEANCLODE_CONFIG: /app/configs/docker.yaml
    command: ["alembic", "upgrade", "head"]
    networks:
      - jeanclode-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ==================== Backend API ====================
  backend:
    profiles: ["app", "all"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeanclode-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JEANCLODE_CONFIG: /app/configs/docker.yaml
      DOCKER_HOST: tcp://docker-proxy:2375
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - jeanclode-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== Frontend ====================
  frontend:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jeanclode-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Browser-facing base (host port mapping).
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
      # SSR-only base: the frontend container's own localhost is not the
      # backend, so server-side fetches must use the compose service name.
      NUXT_API_INTERNAL: ${NUXT_API_INTERNAL:-http://backend:8000}
    networks:
      - jeanclode-network
    depends_on:
      backend:
        condition: service_healthy

  # ==================== CLI Worker (locally built) ====================
  # Built so the agent image the backend launches per execution exists locally
  # at the tag the backend config defaults to (WORKER_IMAGE). Not run as a
  # standalone service.
  cli-worker:
    profiles: ["worker", "all"]
    build:
      context: ./cli
      dockerfile: Dockerfile
    image: ghcr.io/jeanclode-hq/cli:${VERSION:-1.0.1} # x-release-please-version
    container_name: jeanclode-cli-worker
    entrypoint: ["true"]
    restart: "no"
    environment:
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      JEANCLODE_CONTAINER_MODE: "1"
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_HOST: ${GITLAB_HOST:-}
    networks:
      - jeanclode-network

  # ==================== Security Proxy (locally built) ====================
  # Built so the sidecar image the backend launches alongside every agent
  # container exists locally at the tag the backend config defaults to
  # (SECURITY_PROXY_IMAGE). Not run as a standalone service — the backend
  # starts one per execution.
  security-proxy:
    profiles: ["worker", "all"]
    build:
      context: ./security-proxy
      dockerfile: Dockerfile
    image: ghcr.io/jeanclode-hq/security-proxy:1.0.1 # x-release-please-version
    container_name: jeanclode-security-proxy-build
    entrypoint: ["true"]
    restart: "no"

networks:
  jeanclode-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A12"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(50,52,210,0.15)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3234D2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3234D2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="80" y="220" width="80" height="80" rx="20" fill="#3234D2"/>
  <path fill-rule="evenodd" clip-rule="evenodd" d="M116 233L96 263H112L106 273L126 243H110L116 233Z" fill="white"/>

  <!-- Product name -->
  <text x="180" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="52" fill="white" letter-spacing="-1">Jeanclode</text>

  <!-- Tagline -->
  <text x="80" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="28" fill="rgba(200,200,220,0.8)">Your codebase, self-healing.</text>

  <!-- Sub-tagline -->
  <text x="80" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400" font-size="20" fill="rgba(150,150,165,0.9)">Sentry error → triage → fix → pull request. Autonomously.</text>

  <!-- Bottom border accent -->
  <rect x="80" y="480" width="200" height="3" rx="2" fill="#3234D2"/>
  <text x="80" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="18" fill="rgba(100,100,120,0.8)">jeanclode.com</text>
</svg>

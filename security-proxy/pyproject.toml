[project]
name = "security-proxy"
version = "1.1.2" # x-release-please-version
description = "TLS-terminating egress proxy that injects per-host credentials for sandboxed agent containers."
authors = [{ name = "Jeanclode Contributors" }]
license = "AGPL-3.0"
requires-python = ">=3.13"
dependencies = [
    "mitmproxy==11.1.3",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://jeanclode.com"
Repository = "https://github.com/jeanclode-hq/jeanclode"
Issues = "https://github.com/jeanclode-hq/jeanclode/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

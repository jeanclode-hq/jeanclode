[project]
name = "jeanclode"
version = "1.1.4" # x-release-please-version
description = "Autonomous bot that listens to Sentry errors, triages them, and opens PRs to fix code bugs"
authors = [{ name = "Jeanclode Contributors" }]
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0"
keywords = ["sentry", "ai", "llm", "bug-fix", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
]

dependencies = [
    # Web Framework
    "fastapi==0.135.1",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    # Database (PostgreSQL)
    "alembic>=1.17.1",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.44",
    # Queue Backend (FastStream with Redis)
    "faststream[redis]>=0.5.0",
    "redis>=7.0.1",
    # HTTP Client
    "httpx>=0.27.0",
    # Security / Encryption
    "cryptography>=44.0.0",
    "PyJWT[crypto]>=2.9.0",
    # OAuth
    "authlib>=1.6.0",
    "itsdangerous>=2.2.0",
    # Container Runtime (Docker/K8s)
    "aiodocker>=0.23.0",
    "kr8s>=0.20.0",
    # SSE (Server-Sent Events)
    "sse-starlette>=2.2.1",
    # Monitoring & Observability
    "sentry-sdk>=2.43.0",
    # Configuration
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    # Linting & Formatting
    "ruff>=0.15.4",
    "mypy>=1.19.1",
    # Type Stubs
    "types-redis>=4.6.0",
    "types-pyyaml>=6.0.12",
]

[project.urls]
Homepage = "https://jeanclode.com"
Repository = "https://github.com/jeanclode-hq/jeanclode"
Issues = "https://github.com/jeanclode-hq/jeanclode/issues"
Documentation = "https://jeanclode.com/docs"

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api"]
exclude = ["tests*"]

# Ruff Configuration
[tool.ruff]
target-version = "py314"
line-length = 100
fix = true

lint.select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific rules
    "ASYNC", # flake8-async
]
lint.ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "UP007", # Use X | Y for type annotations (pydantic compatibility)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]          # Unused imports in __init__.py
"tests/**/*.py" = ["ARG", "S101"] # Pytest uses assertions
"*" = ["RUF022", "RUF012"]        # Module level import not at top of file
"*/routers/*.py" = ["ARG001"]     # Unused arguments in routers
"*/api/models/*.py" = ["RUF012"]  # SQLAlchemy models

[tool.ruff.lint.isort]
known-first-party = ["jeanclode"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy Configuration
[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
allow_redefinition = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
namespace_packages = true
explicit_package_bases = true
local_partial_types = true

exclude = "^(tests|docs|venv|env|scripts)/"

[[tool.mypy.overrides]]
module = ["kr8s.*", "aiodocker.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=api",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# Coverage Configuration
[tool.coverage.run]
source = ["api"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.4",
    "mypy>=1.19.1",
]

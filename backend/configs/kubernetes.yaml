# Jeanclode Backend Configuration - Kubernetes Deployment
app: jeanclode-backend
environment: production

# Application Options
options:
  claude_code:
    oauth_token: !ENV ${CLAUDE_CODE_OAUTH_TOKEN:-}
    api_key: !ENV ${ANTHROPIC_API_KEY:-}
    model_high: !ENV ${CLAUDE_CODE_MODEL_HIGH:-}
    model_low: !ENV ${CLAUDE_CODE_MODEL_LOW:-}
  backend_url: !ENV ${BACKEND_URL}

# Plugins Configuration
plugins:
  # Database plugin (SQLAlchemy engine management)
  database:
    enabled: true
    url: !ENV ${DATABASE_URL}
    encryption_key: !ENV ${ENCRYPTION_KEY}
    echo: false
    pool_size: 20
    max_overflow: 40
    pool_timeout: 5

  # Web server plugin (FastAPI HTTP server)
  web:
    enabled: true
    host: 0.0.0.0
    port: 8000
    reload: false
    frontend_url: !ENV ${FRONTEND_URL}
    behind_proxy: true
    cors:
      allow_credentials: true
      allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      allow_headers: ["content-type", "authorization", "x-requested-with"]
    session:
      cookie_name: jeanclode_session
      cookie_domain: !ENV ${SESSION_COOKIE_DOMAIN:-}
      cookie_httponly: true
      cookie_samesite: lax
      cookie_secure: true
      inactivity_timeout_hours: 24
      max_lifetime_days: 30
      oauth_state_secret: !ENV ${OAUTH_STATE_SECRET}
    admin:
      # Must be at least 32 characters. Generate with: openssl rand -hex 32
      secret: !ENV ${ADMIN_SECRET:-dev-admin-secret-change-me-at-least-32-chars}
      session_ttl_seconds: 3600
      rate_limit_max_attempts: 5
      rate_limit_window_seconds: 900
      cookie_name: jeanclode_admin

  # GitHub integration (OAuth login + App installation auth)
  github:
    enabled: !ENV ${GITHUB_ENABLED:-true}
    app:
      client_id: !ENV ${GITHUB_CLIENT_ID}
      client_secret: !ENV ${GITHUB_CLIENT_SECRET}
      authorize_url: !ENV ${GITHUB_AUTHORIZE_URL:-https://github.com/login/oauth/authorize}
      token_url: !ENV ${GITHUB_TOKEN_URL:-https://github.com/login/oauth/access_token}
      api_base_url: !ENV ${GITHUB_API_URL:-https://api.github.com/}
      scopes: ["read:user", "user:email", "read:org"]
      app_id: !ENV ${GITHUB_APP_ID}
      private_key_path: !ENV ${GITHUB_APP_PRIVATE_KEY_PATH}
      webhook_secret: !ENV ${GITHUB_WEBHOOK_SECRET}
      name: !ENV ${GITHUB_APP_NAME:-}

  # GitLab integration (OAuth login + webhook)
  gitlab:
    enabled: !ENV ${GITLAB_ENABLED:-true}
    oauth:
      client_id: !ENV ${GITLAB_CLIENT_ID}
      client_secret: !ENV ${GITLAB_CLIENT_SECRET}
      instance_url: !ENV ${GITLAB_INSTANCE_URL:-https://gitlab.com}
      scopes: ["read_user", "read_api"]
    webhook_secret: !ENV ${GITLAB_WEBHOOK_SECRET}

  # OAuth plugin (manages Authlib registration from provider configs)
  oauth:
    enabled: true

  # FastStream Plugin (Redis message queue)
  faststream:
    enabled: true
    app_name: jeanclode-queue
    graceful_timeout: 30.0
    log_level: WARNING
    redis:
      url: !ENV ${REDIS_URL}
      db: !ENV ${REDIS_DB:-0}
      list_cap_size: 10000
      auto_offset_reset: latest
      batch_size: 1
      polling_interval: 0.1
      max_retries: 3
      retry_delay: 1.0
    consumers:
      - topic: jeanclode.events.auth.sync_memberships
        handler: "api.routers.auth.consumer:router"
      - topic: jeanclode.events.orgs.sync_members
        handler: "api.routers.orgs.consumer:router"
      - topic: jeanclode.events.sse
        handler: "api.routers.stream.consumer:router"
      - topic: jeanclode.events.github.sync_installation
        handler: "api.routers.webhooks.github.consumer:router"
      - topic: jeanclode.events.github.sync_repositories
        handler: "api.routers.webhooks.github.consumer:router"
      - topic: jeanclode.events.github.pr
        handler: "api.routers.webhooks.github.pr_consumer:router"
      - topic: jeanclode.events.github.issues
        handler: "api.routers.webhooks.github.issue_consumer:router"
      - topic: jeanclode.events.github.mentions
        handler: "api.routers.webhooks.github.mention_consumer:router"
      - topic: jeanclode.events.gitlab.sync_group_repositories
        handler: "api.routers.sources.gitlab.consumer:router"
      - topic: jeanclode.events.gitlab.sync_project_repository
        handler: "api.routers.sources.gitlab.consumer:router"
      - topic: jeanclode.events.gitlab.project_hook_teardown
        handler: "api.routers.sources.gitlab.consumer:router"
      - topic: jeanclode.events.gitlab.merge_requests
        handler: "api.routers.webhooks.gitlab.consumer:router"
      - topic: jeanclode.events.gitlab.issues
        handler: "api.routers.webhooks.gitlab.issue_consumer:router"
      - topic: jeanclode.events.gitlab.mentions
        handler: "api.routers.webhooks.gitlab.note_consumer:router"
      - topic: jeanclode.events.gitlab.members
        handler: "api.routers.webhooks.gitlab.member_consumer:router"
      - topic: jeanclode.events.gitlab.group
        handler: "api.routers.webhooks.gitlab.hook_consumer:router"
      - topic: jeanclode.events.gitlab.system
        handler: "api.routers.webhooks.gitlab.hook_consumer:router"
      - topic: jeanclode.events.sentry.webhook
        handler: "api.routers.webhooks.sentry.consumer:router"
      - topic: jeanclode.events.sentry.installation
        handler: "api.routers.webhooks.sentry.installation:consumer_router"
      - topic: jeanclode.events.sentry.sync_projects
        handler: "api.routers.sources.sentry.consumer:router"
      - topic: jeanclode.events.sentry.sync_memberships
        handler: "api.routers.sources.sentry.consumer:router"
      - topic: jeanclode.events.sentry.resolve_mappings
        handler: "api.routers.sources.sentry.projects.consumer:router"
      - topic: jeanclode.events.sentry.backfill
        handler: "api.routers.sources.sentry.backfill.consumer:router"
      # Manual dispatch — single-issue fix trigger
      - topic: jeanclode.events.manual_dispatch
        handler: "api.plugins.sentry.consumer:router"
      # GitHub — PR workflow dispatch (manual + webhook-driven)
      - topic: jeanclode.events.github.manual_dispatch
        handler: "api.plugins.github.consumer:router"
      # GitLab — MR workflow dispatch (manual + webhook-driven)
      - topic: jeanclode.events.gitlab.manual_dispatch
        handler: "api.plugins.gitlab.consumer:router"

  # Memory plugin (daily curation of each workspace's agent memory)
  memory:
    enabled: !ENV ${MEMORY_CURATION_ENABLED:-true}
    curation:
      cadence_hours: !ENV ${MEMORY_CURATION_CADENCE_HOURS:-24}

  # Sentry plugin (Sentry API client + issue dispatch)
  sentry:
    enabled: true
    base_url: !ENV ${SENTRY_API_URL:-https://sentry.io}
    auth_token: !ENV ${SENTRY_AUTH_TOKEN}
    client_secret: !ENV ${SENTRY_CLIENT_SECRET}
    timeout: 30.0
    max_retries: 3
    dispatch:
      enabled: true
      interval_seconds: 30
      batch_size: 5
      max_retries: 3
      max_concurrent_dispatches: 50

  # Container Plugin - Kubernetes backend for production
  container:
    enabled: true
    backend: kubernetes
    watcher:
      enabled: true
      reconcile_interval: 60
    kubernetes:
      namespace: !ENV ${K8S_NAMESPACE:-jeanclode}
      service_account: !ENV ${K8S_SERVICE_ACCOUNT:-jc-runner}
      image: !ENV ${WORKER_IMAGE:-ghcr.io/jeanclode-hq/cli:1.4.0} # x-release-please-version
      image_pull_policy: !ENV ${WORKER_IMAGE_PULL_POLICY:-IfNotPresent}
      security_proxy_image: !ENV ${SECURITY_PROXY_IMAGE:-ghcr.io/jeanclode-hq/security-proxy:1.4.0} # x-release-please-version
      memory_limit: 2Gi
      cpu_limit: "2"
      timeout: 3600
      cleanup_jobs: !ENV ${K8S_CLEANUP_JOBS:-true}
